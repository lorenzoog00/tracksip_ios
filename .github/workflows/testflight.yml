name: TestFlight

# Ship a build to TestFlight. Triggered by pushing a tag like v1.0.3, or by
# hand from the Actions tab. CI (ci.yml) still guards every ordinary push;
# this workflow is only for producing an installable build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What to test (shown in TestFlight)"
        required: false
        default: "Internal build"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  upload:
    needs: checks
    name: Archive & upload
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      TEAM_ID: 6T5DB8M42N
      SCHEME: siptrack
      PROJECT: siptrack.xcodeproj

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # A throwaway keychain holds the distribution certificate for this run only.
      # Without a persistent cert, automatic signing would mint a new one on every
      # run and burn through Apple's three-certificate limit in three builds.
      #
      # The archive step signs with a *development* identity first and only the
      # export re-signs for distribution. A fresh runner has no development key,
      # so automatic signing used to mint a new Apple Development certificate on
      # every run and hit the account cap after about seven builds. DEV_CERT_* is
      # one long-lived development certificate made for CI, so nothing is minted.
      - name: Install signing certificates
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DEV_P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          DEV_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # import_p12 SECRET_NAME BASE64 PASSWORD
          import_p12() {
            local name=$1 encoded=$2 password=$3 file="$RUNNER_TEMP/$1.p12"
            # openssl rather than base64(1): the macOS and GNU builds disagree on decode
            # flags. Without -A, `openssl base64 -d` decodes a single long line to
            # 0 bytes, so strip all whitespace and decode as one line: that accepts
            # both wrapped and single-line secrets.
            printf '%s' "$encoded" | tr -d ' \r\n\t' | openssl base64 -d -A > "$file"
            echo "$name: decoded $(stat -f%z "$file") bytes"
            if [ ! -s "$file" ]; then
              echo "::error::${name}_P12_BASE64 is empty. The 'base64 -i file | gh secret set' pipe stored nothing — usually the .p12 path was wrong, so base64 errored and piped an empty string. Check the file exists, then set the secret again."
              exit 1
            fi

            # security(1) reports a bad file and a bad password identically, as
            # "parameters were not valid". Ask openssl first so the log says which.
            # -legacy is needed by OpenSSL 3 for Keychain exports and rejected by LibreSSL.
            if ! P12PASS="$password" openssl pkcs12 -in "$file" -nokeys -legacy \
                   -passin env:P12PASS -out /dev/null 2>"$RUNNER_TEMP/p12err"; then
              if ! P12PASS="$password" openssl pkcs12 -in "$file" -nokeys \
                     -passin env:P12PASS -out /dev/null 2>"$RUNNER_TEMP/p12err"; then
                echo "::error::Could not read the $name .p12 with its password. openssl reported:"
                cat "$RUNNER_TEMP/p12err"
                exit 1
              fi
            fi

            # -f pkcs12 explicitly: without it security guesses the format and often guesses wrong.
            security import "$file" \
              -k "$KEYCHAIN" -P "$password" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$file"
          }

          import_p12 DIST_CERT "$DIST_P12_BASE64" "$DIST_PASSWORD"
          if [ -n "$DEV_P12_BASE64" ]; then
            import_p12 DEV_CERT "$DEV_P12_BASE64" "$DEV_PASSWORD"
          else
            echo "::warning::DEV_CERT_P12_BASE64 is not set, so this run will mint a development certificate."
          fi

          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          security find-identity -v -p codesigning "$KEYCHAIN"

      # xcodebuild and altool each look for the key in their own location.
      # The .p8 is PEM text, so it goes in as-is — no base64 step for you to get wrong.
      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          # Fail loudly here rather than with an opaque signing error later.
          openssl pkey -in ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 -noout \
            || { echo "::error::ASC_KEY_P8 is not a valid private key — re-paste the whole .p8 file including the BEGIN/END lines"; exit 1; }

      # The distribution certificate above is persistent, but
      # -allowProvisioningUpdates still mints a *development* one on most runs
      # for the watch and widget targets. Apple caps how many an account holds,
      # so without this the archive starts failing after roughly seven releases
      # with "maximum number of certificates" — and, misleadingly, with "no iOS
      # App Development provisioning profiles found".
      #
      # Clearing them before the archive leaves a free slot for the one this
      # build is about to create. It never fails the job: housekeeping must not
      # be the reason a release does not ship.
      - name: Revoke stale CI certificates
        # The script swallows its own failures; this covers the step itself
        # failing to start at all, so a missing runtime cannot block a release.
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            node scripts/revoke-ci-certificates.mjs

      # TestFlight rejects a build number it has already seen, so derive a value
      # that always increases and never collides: UTC minutes since the epoch era.
      - name: Compute build number
        id: version
        run: echo "build=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # The repo is public, so TikTok's App Secret stays out of Info.plist and is
          # passed as a build setting; without it the TikTok SDK simply stays off.
          TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SipTrack.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            TIKTOK_APP_SECRET="$TIKTOK_APP_SECRET" \
            -quiet

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SipTrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $IPA (build ${{ steps.version.outputs.build }})"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload archive on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/SipTrack.xcarchive/Info.plist
          retention-days: 7
          if-no-files-found: ignore
