name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: functions
      - run: npm run lint && npm test && npm run test:emulator
        working-directory: functions
      - run: python3 scripts/check-production.py

  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      # Firebase pulls a large SPM graph; caching keeps reruns to a couple of minutes.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Simulator model names churn between runner images, so resolve one at runtime
      # instead of pinning a name that silently disappears.
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          chosen = None
          for runtime, devices in runtimes.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      chosen = (d["udid"], d["name"], runtime)
          if not chosen:
              sys.exit("No available iPhone simulator on this runner")
          print(chosen[0])
          sys.stderr.write("Using %s (%s)\n" % (chosen[1], chosen[2]))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project siptrack.xcodeproj \
            -scheme siptrack

      # Simulator builds need no signing, so CI stays free of certificates entirely.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project siptrack.xcodeproj \
            -scheme siptrack \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      # siptrackUITests holds only the untouched Xcode template stubs; running them costs
      # minutes and its bundle fails to load on the runner. Drop it until it has real tests.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project siptrack.xcodeproj \
            -scheme siptrack \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -skip-testing:siptrackUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Logs/Test/*.xcresult
          retention-days: 7
